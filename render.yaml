services:
  # BACKEND WEB SERVICE
  - type: web
    name: academic-performance-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: studentperformancejwtsecret_production_key

  # FRONTEND STATIC SITE
  - type: web
    name: academic-performance-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://academic-performance-backend.onrender.com/api
